name: Build Nothing 4a Pro Hamster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP (Mobile Upload Support)
        run: |
          if [ -f "HamsterWheelGlyph4aPro.zip" ] && [ ! -f "settings.gradle.kts" ]; then
            unzip -q -o HamsterWheelGlyph4aPro.zip
          fi
          if [ -d "HamsterWheelGlyph4aPro" ] && [ ! -f "settings.gradle.kts" ]; then
            shopt -s dotglob
            mv HamsterWheelGlyph4aPro/* .
            rmdir HamsterWheelGlyph4aPro || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download Nothing Glyph Matrix SDK 2.0 AAR
        run: |
          mkdir -p app/libs
          curl -L https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar -o app/libs/glyph-matrix-sdk-2.0.aar

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamsterWheel-Nothing4aPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
