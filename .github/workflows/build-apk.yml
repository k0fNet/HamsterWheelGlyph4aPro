name: Build Nothing 4a Pro Hamster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack ZIP Archive (if uploaded)
        run: |
          cp .github/workflows/build-apk.yml /tmp/current-workflow.yml
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Распаковываем $ZIP_FILE..."
            rm -rf app
            unzip -q -o "$ZIP_FILE"
            if [ -d "HamsterWheelGlyph4aPro" ]; then
              cp -rf HamsterWheelGlyph4aPro/. .
              rm -rf HamsterWheelGlyph4aPro
            fi
            rm -f "$ZIP_FILE"
          fi
          cp /tmp/current-workflow.yml .github/workflows/build-apk.yml
          sed -i 's/package="com.nothing4apro.hamsterwheel"//g' app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Nothing Glyph Matrix SDK 2.0 AAR
        run: |
          mkdir -p app/libs
          curl -fL https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar -o app/libs/glyph-matrix-sdk-2.0.aar

      - name: Build Debug APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk HamsterWheel-Nothing4aPro.apk

      - name: Commit Unpacked Files to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .github
          git add --all -- ':!.github' ':!app/libs' ':!HamsterWheel-Nothing4aPro.apk'
          git commit -m "chore: update unpacked project files [skip ci]" || true
          git push || true

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: "Charging Hamster 4a Pro (Latest APK)"
          body: "Готовый APK для установки в 1 нажатие с телефона."
          files: HamsterWheel-Nothing4aPro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HamsterWheel-Nothing4aPro-APK
          path: HamsterWheel-Nothing4aPro.apk
