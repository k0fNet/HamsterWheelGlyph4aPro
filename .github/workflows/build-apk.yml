name: Build Nothing 4a Pro Hamster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Unpack ZIP & Commit Clean Project Structure
        run: |
          cp .github/workflows/build-apk.yml /tmp/current-workflow.yml
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Найден архив $ZIP_FILE — распаковываем в корень репозитория..."
            rm -rf app
            unzip -q -o "$ZIP_FILE"
            if [ -d "HamsterWheelGlyph4aPro" ]; then
              cp -rf HamsterWheelGlyph4aPro/. .
              rm -rf HamsterWheelGlyph4aPro
            fi
            rm -f "$ZIP_FILE"
          fi
          cp /tmp/current-workflow.yml .github/workflows/build-apk.yml

          # Авто-фикс AndroidManifest.xml (для AGP 8+)
          sed -i 's/package="com.nothing4apro.hamsterwheel"//g' app/src/main/AndroidManifest.xml

          # Авто-фикс exhaustive when для DANCING во всех сервисах уведомлений
          for f in app/src/main/java/com/nothing4apro/hamsterwheel/*.kt; do
            if grep -q "when (HamsterAnimatorEngine.currentState)" "$f" && ! grep -q "else ->" "$f"; then
              sed -i 's/HamsterAnimatorEngine.State.DISABLED -> "Отключено"/HamsterAnimatorEngine.State.DANCING -> "Хомячок танцует под музыку 🎵"\n            HamsterAnimatorEngine.State.DISABLED -> "Отключено"\n            else -> "Хомячок в колесе"/g' "$f"
            fi
          done

          # Сохраняем распакованные файлы обратно в репозиторий (не трогая папку .github)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .github
          git add --all -- ':!.github'
          git commit -m "chore: auto-unpack project structure [skip ci]" || true
          git push || echo "Продолжаем сборку APK..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Nothing Glyph Matrix SDK 2.0 AAR
        run: |
          mkdir -p app/libs
          curl -fL https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar -o app/libs/glyph-matrix-sdk-2.0.aar

      - name: Build Debug APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk HamsterWheel-Nothing4aPro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HamsterWheel-Nothing4aPro-APK
          path: HamsterWheel-Nothing4aPro.apk

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Charging Hamster 4a Pro (Latest APK)"
          body: "Готовый APK для установки в 1 нажатие с телефона."
          files: HamsterWheel-Nothing4aPro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
