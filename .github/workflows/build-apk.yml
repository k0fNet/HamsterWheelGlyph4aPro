name: Build Nothing 4a Pro Hamster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unpack Project Archive
        run: |
          echo "=== Файлы в репозитории до распаковки ==="
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Распаковываем архив: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE"
          fi
          if [ -d "HamsterWheelGlyph4aPro" ] && [ ! -f "settings.gradle.kts" ]; then
            shopt -s dotglob
            mv -f HamsterWheelGlyph4aPro/* .
            rmdir HamsterWheelGlyph4aPro || true
          fi
          echo "=== Файлы после распаковки ==="
          ls -la
          test -f "settings.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Nothing Glyph Matrix SDK 2.0 AAR
        run: |
          mkdir -p app/libs
          curl -fL https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar -o app/libs/glyph-matrix-sdk-2.0.aar

      - name: Install Gradle 8.7 & Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamsterWheel-Nothing4aPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
